<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Login — The Spaceship</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="portal.css">
</head>
<body>
<main>
  <div class="wrap">
    <div class="card center-card">
      <h1>The Spaceship</h1>

      <!-- Real <form> elements (not just <div>s) so pressing Enter in any
           field submits, same as clicking the button. -->
      <form id="signin-form">
        <p class="lede" style="text-align:center; margin:0 0 20px;">Member login</p>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="username">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password">
        </div>
        <button class="btn" type="submit" id="signin-btn" style="width:100%; justify-content:center;">Log In</button>
        <p class="msg" id="signin-msg"></p>
        <p style="text-align:center; margin-top:14px;">
          <a href="#" id="forgot-link" style="font-size:13px;">Forgot your password?</a>
        </p>
      </form>

      <form id="forgot-form" hidden>
        <p class="lede" style="text-align:center; margin:0 0 20px;">Enter your email and we'll send you a reset link.</p>
        <div class="field">
          <label for="forgot-email">Email</label>
          <input type="email" id="forgot-email" autocomplete="username">
        </div>
        <button class="btn" type="submit" id="forgot-btn" style="width:100%; justify-content:center;">Send Reset Link</button>
        <p class="msg" id="forgot-msg"></p>
        <p style="text-align:center; margin-top:14px;">
          <a href="#" id="back-to-login-link" style="font-size:13px;">Back to log in</a>
        </p>
      </form>

      <form id="setpw-form" hidden>
        <p class="lede" style="text-align:center; margin:0 0 20px;">Welcome — set a password for your account.</p>
        <div class="field">
          <label for="new-password">New password</label>
          <input type="password" id="new-password" autocomplete="new-password">
        </div>
        <button class="btn" type="submit" id="setpw-btn" style="width:100%; justify-content:center;">Set Password &amp; Continue</button>
        <p class="msg" id="setpw-msg"></p>
      </form>
    </div>
  </div>
</main>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
  import { SUPABASE_URL, SUPABASE_ANON_KEY } from './config.js';

  // Read + classify the URL hash BEFORE creating the Supabase client.
  // Supabase parses out any auth params (access_token, type, ...) from the
  // hash as soon as it processes them and then strips the hash from the
  // URL — so re-reading window.location.hash later (from an event handler,
  // after an await) is unreliable, it may already be gone by then. Capture
  // it once, up front, and use that everywhere below instead.
  const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
  const authLinkType = hashParams.get('type'); // 'invite' | 'recovery' | null
  const cameFromAuthLink = hashParams.has('access_token') && (authLinkType === 'invite' || authLinkType === 'recovery');
  const authLinkError = hashParams.get('error_description') || hashParams.get('error');

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const signinForm = document.getElementById('signin-form');
  const setpwForm = document.getElementById('setpw-form');
  const forgotForm = document.getElementById('forgot-form');

  async function routeAfterLogin() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) return;
    const { data: admin } = await supabase.from('admins').select('email').eq('email', session.user.email).maybeSingle();
    window.location.href = admin ? 'admin.html' : 'dashboard.html';
  }

  if (cameFromAuthLink) {
    // Arrived via an invite or password-reset link. Supabase's client
    // picks up the session from the URL in the background (asynchronously)
    // — show the set-password step right away rather than waiting on an
    // auth event that may already have fired before we could listen for it.
    signinForm.hidden = true;
    forgotForm.hidden = true;
    setpwForm.hidden = false;
  } else {
    if (authLinkError) {
      const msg = document.getElementById('signin-msg');
      msg.textContent = `${decodeURIComponent(authLinkError).replace(/\+/g, ' ')} Request a new link and try again.`;
      msg.className = 'msg error';
    }
    // Already signed in from an earlier visit? skip straight through.
    routeAfterLogin();
  }

  signinForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const msg = document.getElementById('signin-msg');
    msg.textContent = 'Signing in…';
    msg.className = 'msg';
    const { error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) {
      msg.textContent = error.message;
      msg.className = 'msg error';
      return;
    }
    msg.textContent = '';
    routeAfterLogin();
  });

  setpwForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = document.getElementById('new-password').value;
    const msg = document.getElementById('setpw-msg');
    if (password.length < 8) {
      msg.textContent = 'Use at least 8 characters.';
      msg.className = 'msg error';
      return;
    }
    msg.textContent = 'Saving…';
    msg.className = 'msg';
    // The session from the invite/recovery link is established
    // asynchronously in the background — make sure it's actually ready
    // before trying to set the password, and give a clear message if the
    // link turned out to be expired/already used instead of a silent fail.
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) {
      msg.textContent = "This link has expired or was already used. Request a new one and try again.";
      msg.className = 'msg error';
      return;
    }
    const { error } = await supabase.auth.updateUser({ password });
    if (error) {
      msg.textContent = error.message;
      msg.className = 'msg error';
      return;
    }
    routeAfterLogin();
  });

  document.getElementById('forgot-link').addEventListener('click', (e) => {
    e.preventDefault();
    document.getElementById('forgot-email').value = document.getElementById('email').value;
    signinForm.hidden = true;
    forgotForm.hidden = false;
  });

  document.getElementById('back-to-login-link').addEventListener('click', (e) => {
    e.preventDefault();
    forgotForm.hidden = true;
    signinForm.hidden = false;
  });

  forgotForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('forgot-email').value.trim();
    const msg = document.getElementById('forgot-msg');
    if (!email) {
      msg.textContent = 'Enter your email first.';
      msg.className = 'msg error';
      return;
    }
    msg.textContent = 'Sending…';
    msg.className = 'msg';
    const { error } = await supabase.auth.resetPasswordForEmail(email, {
      redirectTo: `${window.location.origin}/portal/login.html`,
    });
    if (error) {
      msg.textContent = error.message;
      msg.className = 'msg error';
      return;
    }
    msg.textContent = "Check your email for a reset link.";
    msg.className = 'msg success';
  });
</script>
</body>
</html>
